name: TRMNL
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - name: Locate gem directories
        id: gems
        run: |
          echo "dir=$(gem env gemdir)" >> "$GITHUB_OUTPUT"
          echo "bindir=$(ruby -e 'print Gem.bindir')" >> "$GITHUB_OUTPUT"
          echo "ruby=$(ruby -e 'print RUBY_VERSION')" >> "$GITHUB_OUTPUT"
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Cache installed gems
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.gems.outputs.dir }}
            ${{ steps.gems.outputs.bindir }}
          key: gems-trmnl_preview-${{ runner.os }}-ruby${{ steps.gems.outputs.ruby }}-${{ steps.gems.outputs.month }}
      - run: gem install trmnl_preview
      - run: trmnlp lint
