name: TRMNL
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "4.0"
      - name: Locate gem directories
        id: gems
        run: |
          echo "dir=$(gem env gemdir)" >> "$GITHUB_OUTPUT"
          echo "bindir=$(ruby -e 'print Gem.bindir')" >> "$GITHUB_OUTPUT"
          echo "ruby=$(ruby -e 'print RUBY_VERSION')" >> "$GITHUB_OUTPUT"
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      # Keyed on gem name, exact Ruby version and month. The gem itself stays unpinned.
      - name: Cache installed gems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gems.outputs.dir }}
            ${{ steps.gems.outputs.bindir }}
          key: gems-trmnl_preview-${{ runner.os }}-ruby${{ steps.gems.outputs.ruby }}-${{ steps.gems.outputs.month }}
      - run: gem install trmnl_preview
      - run: trmnlp lint
